<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyLink</title>
<style>
  :root {
    --bg: #eef3f1;
    --ink: #1b2a2f;
    --muted: #5a6b70;
    --card: #ffffff;
    --line: #c9d6d2;
    --accent: #1f6f78;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12201f;
      --ink: #e8f0ee;
      --muted: #9db1ad;
      --card: #1a2d2c;
      --line: #2e4745;
      --accent: #6cc4cc;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    display: flex;
    justify-content: center;
    padding: 56px 20px;
  }
  main { width: 100%; max-width: 440px; }
  .avatar {
    width: 88px; height: 88px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: grid; place-items: center;
    font-size: 36px; font-weight: 700;
    margin: 0 auto 18px;
  }
  h1 { font-size: 26px; margin: 0 0 6px; text-align: center; letter-spacing: -0.02em; }
  p.bio { margin: 0 0 32px; text-align: center; color: var(--muted); line-height: 1.6; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  a.link {
    display: block; padding: 16px 20px;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 14px;
    text-decoration: none; font-weight: 600;
    transition: border-color .15s, transform .15s;
  }
  a.link:hover { border-color: var(--accent); transform: translateY(-2px); }
  a.link:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  a.link small { display: block; font-weight: 400; color: var(--muted); margin-top: 2px; }
  @media (prefers-reduced-motion: reduce) { a.link { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="avatar" aria-hidden="true">M</div>
  <h1>내 이름</h1>
  <p class="bio">안녕하세요! 제가 만든 것들과 활동 링크를 한곳에 모았습니다.</p>
  <ul>
    <li><a class="link" href="https://github.com/내-아이디" target="_blank" rel="noopener">GitHub<small>코드와 프로젝트 보기</small></a></li>
    <li><a class="link" href="https://www.instagram.com/내-아이디" target="_blank" rel="noopener">Instagram<small>일상과 소식</small></a></li>
    <li><a class="link" href="https://blog.naver.com/내-아이디" target="_blank" rel="noopener">블로그<small>공부하고 기록한 글</small></a></li>
    <li><a class="link" href="mailto:me@example.com">이메일 보내기<small>me@example.com</small></a></li>
  </ul>
</main>
</body>
</html>
